<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" role="img" aria-label="Four-stage pipeline: ingestion, triage, writing, assembly; output files represent state, with humans at review points">
  <rect width="720" height="430" fill="#fcfcfb"/>

  <text x="32" y="34" font-size="17" font-weight="600" fill="#1a1a19">Four stages of the pipeline</text>
  <text x="32" y="56" font-size="13" fill="#5c5b55">No separate state store — the files in each directory are the state</text>

  <defs>
    <marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8a8980"/>
    </marker>
  </defs>

  <!-- stages -->
  <g font-size="12.5">
    <rect x="32" y="86" width="146" height="62" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="105" y="108" text-anchor="middle" font-weight="600" fill="#1a1a19">[1] Ingestion</text>
    <text x="105" y="127" text-anchor="middle" fill="#5c5b55">Scripts · no LLM</text>
    <text x="105" y="142" text-anchor="middle" font-size="11" fill="#8a8980">Feeds: 178 vendors</text>

    <path d="M184 117 L204 117" stroke="#8a8980" stroke-width="1.5" marker-end="url(#ax)"/>

    <rect x="210" y="86" width="146" height="62" rx="7" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
    <text x="283" y="108" text-anchor="middle" font-weight="600" fill="#1a1a19">[2] Triage</text>
    <text x="283" y="127" text-anchor="middle" fill="#5c5b55">Haiku · batch</text>
    <text x="283" y="142" text-anchor="middle" font-size="11" fill="#8a8980">Gates G1–G5</text>

    <path d="M362 117 L382 117" stroke="#8a8980" stroke-width="1.5" marker-end="url(#ax)"/>

    <rect x="388" y="86" width="146" height="62" rx="7" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="461" y="108" text-anchor="middle" font-weight="600" fill="#1a1a19">[3] Writing</text>
    <text x="461" y="127" text-anchor="middle" fill="#5c5b55">Sonnet · per article</text>
    <text x="461" y="142" text-anchor="middle" font-size="11" fill="#8a8980">Read source → card</text>

    <path d="M540 117 L560 117" stroke="#8a8980" stroke-width="1.5" marker-end="url(#ax)"/>

    <rect x="566" y="86" width="122" height="62" rx="7" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/>
    <text x="627" y="108" text-anchor="middle" font-weight="600" fill="#1a1a19">[4] Assembly</text>
    <text x="627" y="127" text-anchor="middle" fill="#5c5b55">Scripts · no LLM</text>
    <text x="627" y="142" text-anchor="middle" font-size="11" fill="#8a8980">DB → serving</text>
  </g>

  <!-- artifacts -->
  <text x="32" y="184" font-size="12.5" font-weight="600" fill="#1a1a19">Artifacts = state</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5c5b55">
    <rect x="32" y="194" width="656" height="44" rx="6" fill="#f2f1ec"/>
    <text x="48" y="213">content/&lt;id&gt;/</text>
    <text x="48" y="230">  meta.json  →  original.md  →  triage.json  →  card.md  →  <tspan fill="#0d6b4a">in cards.json = served</tspan></text>
  </g>
  <text x="32" y="256" font-size="11.5" fill="#8a8980">No state ledger. Resume by processing only the missing next file.</text>

  <!-- human layer -->
  <text x="32" y="296" font-size="12.5" font-weight="600" fill="#1a1a19">Where humans participate</text>

  <g>
    <rect x="32" y="306" width="656" height="60" rx="6" fill="#eb6834" opacity="0.08" stroke="#eb6834" stroke-width="1.5"/>
    <text x="48" y="328" font-size="12.5" fill="#1a1a19">Admin console — review decisions and cards; leave <tspan font-weight="600">💬 a brief comment</tspan></text>
    <text x="48" y="349" font-size="12" fill="#5c5b55">Writing and assembly run unattended. Review feedback becomes reusable criteria.</text>
  </g>

  <!-- feedback arrows back -->
  <path d="M283 306 L283 156" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ax)" opacity="0.75"/>
  <path d="M461 306 L461 156" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ax)" opacity="0.75"/>

  <text x="32" y="396" font-size="12" fill="#5c5b55">Run revisions manually once comments accumulate; triage and writing criteria update separately.</text>
  <text x="32" y="416" font-size="12" fill="#8a8980">No automatic updates. Criteria change only with human approval.</text>
</svg>
