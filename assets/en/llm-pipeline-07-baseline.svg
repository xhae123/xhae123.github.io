<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" role="img" aria-label="Measured baseline: triage pass rate 26.5%, bring precision 71.8%, writing acceptance 42.3%">
  <rect width="720" height="280" fill="#fcfcfb"/>

  <text x="32" y="36" font-size="17" font-weight="600" fill="#1a1a19">Baseline — measured before revisions</text>
  <text x="32" y="58" font-size="13" fill="#5c5b55">294 decisions: bring 78 / skip 216 · a reference for future comparisons</text>

  <!-- three metric rows -->
  <g>
    <!-- 1 -->
    <text x="32" y="102" font-size="13" fill="#1a1a19">Triage pass rate</text>
    <rect x="150" y="88" width="440" height="18" rx="4" fill="#e8e7e1"/>
    <rect x="150" y="88" width="116.6" height="18" rx="4" fill="#2a78d6"/>
    <text x="602" y="102" font-size="14" font-weight="700" fill="#1a1a19">26.5%</text>
    <text x="150" y="124" font-size="11.5" fill="#5c5b55">Low is not bad: filtering is the job. Abrupt changes can signal unstable gates.</text>

    <!-- 2 (star) -->
    <text x="32" y="166" font-size="13" font-weight="700" fill="#1a1a19">bring precision</text>
    <rect x="150" y="152" width="440" height="18" rx="4" fill="#e8e7e1"/>
    <rect x="150" y="152" width="315.9" height="18" rx="4" fill="#4a3aa7"/>
    <text x="602" y="166" font-size="14" font-weight="700" fill="#1a1a19">71.8%</text>
    <text x="150" y="188" font-size="11.5" fill="#4a3aa7" font-weight="600">★ Key metric: the other 28% were discarded after spending 45K.</text>

    <!-- 3 -->
    <text x="32" y="230" font-size="13" fill="#1a1a19">Writing acceptance</text>
    <rect x="150" y="216" width="440" height="18" rx="4" fill="#e8e7e1"/>
    <rect x="150" y="216" width="186.1" height="18" rx="4" fill="#1baf7a"/>
    <text x="602" y="230" font-size="14" font-weight="700" fill="#1a1a19">42.3%</text>
    <text x="150" y="252" font-size="11.5" fill="#5c5b55">Share served; 23 cards awaiting assembly still depress this rate.</text>
  </g>
</svg>
